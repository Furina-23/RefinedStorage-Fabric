name: Build release

on:
  push:
    tags:
      - 'fabric-migration-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or commit to build and attach to a release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" check build

      - name: Attach JARs to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/libs/refinedstorage-fabric-1.20.1.jar
          fail_on_unmatched_files: true
